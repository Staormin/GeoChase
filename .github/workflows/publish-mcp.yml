# Publishes geochase-mcp to npm when mcp/package.json holds a version npm doesn't have yet.
# To release: bump the version in mcp/ (npm version patch) and merge to main.
# npm trusts this workflow by filename (trusted publishing): if you rename this file,
# update the trusted publisher on npmjs.com. No npm token is involved.
name: Publish MCP server

on:
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - '.github/workflows/publish-mcp.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # Required for npm trusted publishing

concurrency:
  group: publish-mcp
  cancel-in-progress: false

defaults:
  run:
    working-directory: mcp

jobs:
  publish:
    name: Publish if the version is new
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.tool-versions'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false # Never reuse a cache in a release build

      - name: Setup npm
        run: npm install --global npm@12.0.2

      - name: Check whether this version is already published
        id: version
        run: |
          package="$(node --print "require('./package.json').name")"
          version="$(node --print "require('./package.json').version")"
          if npm view "$package@$version" version --silent 2>/dev/null | grep --quiet .; then
            echo "$package@$version is already on npm, nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing $package@$version."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      - name: Type check
        if: steps.version.outputs.publish == 'true'
        run: npm run type-check

      # prepack builds dist/; npm adds provenance on its own.
      - name: Publish
        if: steps.version.outputs.publish == 'true'
        run: npm publish
